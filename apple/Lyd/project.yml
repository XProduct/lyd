name: Lyd
options:
  bundleIdPrefix: com.xproduct
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: "899E8CDT3V"
targets:
  Lyd:
    type: application
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Lyd
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xproduct.lyd.remote
        PRODUCT_NAME: Lyd
        DEVELOPMENT_TEAM: "899E8CDT3V"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Lyd/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lyd
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Lyd discovers and controls your Lyd music player on the local network.
        INFOPLIST_KEY_NSBonjourServices: ["_lyd._tcp"]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2,3"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    scheme:
      testTargets: []
      gatherCoverageData: false
